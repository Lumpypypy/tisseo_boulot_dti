
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accueil</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            height: 100vh;
            display: flex;
        }

        .container {
            display: flex;
            width: 100%;
            height: 100%;
        }

        .section {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            text-decoration: none;
            color: white;
            font-size: 2.5rem;
            font-weight: bold;
            transition: opacity 0.3s;
        }

        .section:hover {
            opacity: 0.8;
        }

        .trajet {
            background-color: #174A75;
        }

        .metro {
            background-color: #25845B;
        }

        @media (max-width: 600px) {
            .container {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <a href="trajet_dti.html" class="section trajet">
            Trajet DTI
        </a>

        <a href="metro.html" class="section metro">
            Métro
        </a>
    </div>

</body>
</html>
