<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Carte du métro de Toulouse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
/* Disposition : carte plein écran, barre d'état en haut, panneau de détails en bas. Rames : flèche orientée, couleur de ligne à quai, bleue en transit. */
:root{
  --bg:#f3f1f4; --card:#ffffff; --fg:#1d1a22; --muted:#6b6573; --line:#e1dde6;
  --la:#d7263d; --la-ink:#ffffff; --lb:#f2b705; --lb-ink:#1d1a22; --live:#1c7a4a; --bad:#b3261e; --sel:#fbe6ee; --transit:#2563eb; --transit-ink:#ffffff;
  --display:'Barlow Condensed','Arial Narrow',sans-serif; --body:'Barlow',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141218; --card:#1e1b24; --fg:#f0edf3; --muted:#a29bab; --line:#322e3b;
  --la:#ff5468; --la-ink:#2a0d19; --lb:#f7c52b; --lb-ink:#1d1a22; --live:#58c98c; --bad:#ff8a80; --sel:#3a2230; --transit:#7aa2ff; --transit-ink:#10172b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141218; --card:#1e1b24; --fg:#f0edf3; --muted:#a29bab; --line:#322e3b;
  --la:#ff5468; --la-ink:#2a0d19; --lb:#f7c52b; --lb-ink:#1d1a22; --live:#58c98c; --bad:#ff8a80; --sel:#3a2230; --transit:#7aa2ff; --transit-ink:#10172b; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.4;display:flex;flex-direction:column}
.top{padding:10px 16px;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;border-bottom:1px solid var(--line);background:var(--card)}
h1{font-family:var(--display);font-weight:700;font-size:1.4rem;line-height:1.1;margin:0}
.clock{font-family:var(--display);font-weight:600;font-size:1.4rem;font-variant-numeric:tabular-nums;margin-left:auto}
.tools{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;width:100%}
.status{color:var(--muted);font-size:.85rem;flex:1 1 200px;min-width:0}
button{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer}
button:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
button.lt{display:inline-flex;gap:8px;align-items:center}
button.lt[aria-pressed="false"]{opacity:.5}
.lb{font-family:var(--display);font-weight:700;min-width:1.7rem;text-align:center;border-radius:5px;padding:0 6px}
.lb.A{background:var(--la);color:var(--la-ink)} .lb.B{background:var(--lb);color:var(--lb-ink)}
.cnt{font-size:.82rem;color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.85rem;color:var(--muted);align-items:center;width:100%}
.legend .k{display:inline-flex;align-items:center;gap:6px}
.dotk{display:inline-block;width:14px;height:14px;border-radius:50%;border:3px solid var(--fg)}
.dotk.q{background:var(--la)} .dotk.t{background:var(--transit)}
.banner{margin:0;border-bottom:1px solid var(--bad);color:var(--bad);padding:8px 16px;font-size:.9rem;background:var(--card)}
.banner.sim{border-color:var(--muted);color:var(--muted)}
#map{flex:1;min-height:0;width:100%;background:var(--bg)}
.leaflet-container{font-family:var(--body)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.9) contrast(.9)}}
:root[data-theme="dark"] .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.9) contrast(.9)}

.stlabel{background:var(--card);color:var(--fg);border:1px solid var(--line);box-shadow:none;padding:1px 5px;font-size:12px;font-weight:500}
.stlabel::before{display:none}
.nolabels .stlabel{display:none}
.mk{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:15px;line-height:1;border:3px solid var(--la);background:var(--la);color:var(--la-ink);box-shadow:0 1px 4px rgba(0,0,0,.45)}
.mk.B{border-color:var(--lb);background:var(--lb);color:var(--lb-ink)}
.mk.transit{background:var(--transit);color:var(--transit-ink)}
.mk.sel{outline:3px solid var(--fg);outline-offset:1px}
.mk .ar{display:block}
.mk.rt::after{content:"";position:absolute;right:-3px;top:-3px;width:9px;height:9px;border-radius:50%;background:var(--live);border:1px solid var(--card)}
.panel{flex:none;background:var(--card);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));max-height:34vh;overflow:auto}
.panel .in{max-width:960px;margin:0 auto}
.panel h3{margin:0 0 6px;font-family:var(--display);font-size:1.3rem;display:flex;gap:10px;align-items:center}
.panel h3 button{margin-left:auto}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px 20px}
.cols h4{margin:6px 0 2px;font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.row{display:flex;gap:10px;font-variant-numeric:tabular-nums;padding:2px 0}
.row .w{color:var(--muted);margin-left:auto}
.row .t{font-family:var(--display);font-weight:600;font-size:1.15rem}
.dotlive{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--live);margin-right:4px}
.note{color:var(--muted);font-size:.85rem}
.state{margin:0 0 8px;font-weight:600}
@media (max-width:600px){
  .top{padding:8px 12px;gap:4px 10px}
  h1{font-size:1.15rem} .clock{font-size:1.15rem}
  .status{flex-basis:100%;font-size:.78rem}
  .legend .k:last-child{display:none}
  .panel{max-height:30vh}
}
details.diag{padding:6px 16px;background:var(--card);border-top:1px solid var(--line);font-size:.85rem}
summary{cursor:pointer;color:var(--muted)}
pre{white-space:pre-wrap;overflow-x:auto;font-size:.78rem;max-height:30vh;overflow-y:auto;margin:6px 0}
</style>
</head>
<body>
<div class="top">
  <h1>Métro de Toulouse en direct</h1>
  <div class="clock" id="clock" aria-label="Heure">--:--:--</div>
  <div class="tools">
    <button type="button" class="lt" id="tg-A" aria-pressed="true"><span class="lb A">A</span><span class="cnt" id="cnt-A"></span></button>
    <button type="button" class="lt" id="tg-B" aria-pressed="true"><span class="lb B">B</span><span class="cnt" id="cnt-B"></span></button>
    <button type="button" id="refresh">Actualiser</button>
    <button type="button" id="sim" aria-pressed="false">Simulation</button>
    <span class="status" id="status">Chargement…</span>
  </div>
  <div class="legend"><span class="k"><span class="dotk q"></span>À quai</span><span class="k"><span class="dotk t"></span>En transit entre deux stations</span><span class="k">La flèche indique le sens de circulation</span></div>
</div>
<div id="banner"></div>
<div id="map" class="nolabels"></div>
<details class="diag" id="diagwrap"><summary>Diagnostic</summary><pre id="diag"></pre></details>
<aside class="panel" id="panel" hidden></aside>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>

const RELAY='https://21b7ecab.tisseo-relais.pages.dev'; // relais Cloudflare (même adresse que la page trajet)
const REFRESH_MS=60000;
const ROW=44;

/*PURE*/
const norm=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
const LINES=[
 {id:'A',start:'basso',end:'balma',names:['Basso Cambo','Bellefontaine','Reynerie','Mirail-Université','Bagatelle','Mermoz','Fontaine-Lestang','Arènes','Patte d\'Oie','Saint-Cyprien République','Esquirol','Capitole','Jean Jaurès','Marengo SNCF','Jolimont','Roseraie','Argoulets','Balma-Gramont']},
 {id:'B',start:'borderouge',end:'ramonville',names:['Borderouge','Trois Cocus','La Vache','Barrière de Paris','Minimes-Claude Nougaro','Canal du Midi','Compans-Caffarelli','Jeanne d\'Arc','Jean Jaurès','François Verdier','Carmes','Palais de Justice','Saint-Michel Marcel Langer','Empalot','Saint-Agne SNCF','Saouzelong','Université Paul Sabatier','Faculté de Pharmacie','Ramonville']}
];
const STOPS={};
LINES.forEach(L=>L.names.forEach(n=>{const k=norm(n);(STOPS[k]=STOPS[k]||{k,n,lines:[],id:null}).lines.push(L.id)}));

function parseDeps(j){
  const d=(j&&j.departures&&j.departures.departure)||[];
  return d.map(x=>({
    t:new Date(String(x.dateTime).replace(' ','T')).getTime(),
    line:x.line&&x.line.shortName,
    dest:(x.destination&&x.destination[0]&&x.destination[0].name)||'',
    rt:x.realTime==='yes'
  })).filter(x=>!isNaN(x.t));
}

/* Relie les passages d'une même rame d'une station à la suivante. */
function buildTrips(L,DEPS,dir,now){
  const n=L.names.length;
  const order=dir>0?[...Array(n).keys()]:[...Array(n).keys()].reverse();
  const want=dir>0?L.end:L.start;
  const lists=order.map(i=>(DEPS[norm(L.names[i])]||[]).filter(d=>d.line===L.id&&norm(d.dest).includes(want)).sort((a,b)=>a.t-b.t));
  const trips=[];const diffs=order.map(()=>[]);let unmatched=0;
  lists.forEach((lst,k)=>{
    const used=new Set();
    if(k>0){
      trips.filter(tr=>tr.stops[tr.stops.length-1].k===k-1).sort((a,b)=>a.stops[a.stops.length-1].t-b.stops[b.stops.length-1].t).forEach(tr=>{
        const last=tr.stops[tr.stops.length-1];
        let best=-1,bs=1e18;
        lst.forEach((d,j)=>{if(used.has(j))return;const df=d.t-last.t;if(df<30000||df>400000)return;const s=Math.abs(df-100000);if(s<bs){bs=s;best=j}});
        if(best>=0){used.add(best);diffs[k].push(lst[best].t-last.t);tr.stops.push({k,i:order[k],t:lst[best].t,rt:lst[best].rt})}
      });
    }
    lst.forEach((d,j)=>{if(!used.has(j)){if(k>0)unmatched++;trips.push({dir,line:L.id,stops:[{k,i:order[k],t:d.t,rt:d.rt}]})}});
  });
  const med=diffs.map(a=>{if(!a.length)return null;const s=[...a].sort((x,y)=>x-y);return s[s.length>>1]});
  trips.forEach(tr=>{
    let cur=tr.stops[0];
    while(cur.k>0){
      const est=cur.t-(med[cur.k]||110000);
      const s={k:cur.k-1,i:order[cur.k-1],t:est,est:true};
      tr.stops.unshift(s);cur=s;
      if(est<=now)break;
    }
  });
  return {trips,med,unmatched,order};
}
const DWELL=25000; // durée supposée à quai avant l'heure de passage
function stateAt(tr,T){
  const s=tr.stops;
  if(T<s[0].t-DWELL)return null;
  for(let j=0;j<s.length;j++){
    if(T<s[j].t-DWELL)return {state:'transit',i0:s[j-1].i,i1:s[j].i,from:s[j-1],to:s[j]};
    if(T<s[j].t)return {state:'quai',i:s[j].i,stop:s[j]};
  }
  const last=s[s.length-1];
  return T<last.t+DWELL?{state:'quai',i:last.i,stop:last}:null;
}
function simDeps(now){
  const D={};
  LINES.forEach(L=>[1,-1].forEach(dir=>{
    const n=L.names.length;
    for(let s=now-60*60000;s<now+90*60000;s+=(L.id==='A'?4:5)*60000+(dir>0?0:60000)){
      for(let k=0;k<n;k++){
        const t=s+k*115000;
        if(t<now)continue;
        const i=dir>0?k:n-1-k;
        const key=norm(L.names[i]);
        (D[key]=D[key]||[]).push({t,line:L.id,dest:dir>0?L.names[n-1]:L.names[0],rt:false});
      }
    }
  }));
  return D;
}
/*ENDPURE*/

/* ---------- Réseau ---------- */
const stamp=d=>{const p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`};
async function api(path,params){
  const u=new URL(RELAY+'/'+path);
  Object.entries(params).forEach(([k,v])=>u.searchParams.set(k,v));
  const r=await fetch(u);
  if(!r.ok)throw new Error('HTTP '+r.status+' sur '+path);
  return r.json();
}
let idCache={};
try{idCache=JSON.parse(localStorage.getItem('tm-ids')||'{}')}catch(e){}
const saveIds=()=>{try{localStorage.setItem('tm-ids',JSON.stringify(idCache))}catch(e){}};

async function fetchStop(st,now){
  const ask=id=>api('stops_schedules.json',{stopsList:id,datetime:stamp(new Date(now)),number:60,displayRealTime:1}).then(parseDeps);
  const ok=deps=>deps.some(d=>st.lines.includes(d.line));
  if(idCache[st.k]){const d=await ask(idCache[st.k]);if(ok(d))return d}
  const j=await api('places.json',{term:st.n,displayOnlyStopAreas:1});
  const cands=((j.placesList&&j.placesList.place)||[]).slice(0,5);
  for(const c of cands){
    const d=await ask(c.id);
    if(ok(d)){idCache[st.k]=c.id;saveIds();return d}
  }
  throw new Error('Aucun passage de métro trouvé');
}
async function pool(items,n,fn){
  let i=0;const run=async()=>{while(i<items.length){const it=items[i++];await fn(it)}};
  await Promise.all(Array.from({length:n},run));
}

/* ---------- État ---------- */
let DEPS={},TRIPS={},INFO={},simMode=false,lastOk=0,lastErrors=[];
let sel=null; // {type:'st',k} ou {type:'tr',line,dir,lastI,lastT}
const $=s=>document.querySelector(s);
const hm=t=>new Date(t).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
const hms=t=>new Date(t).toLocaleTimeString('fr-FR');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function recompute(now){
  LINES.forEach(L=>{
    const f=buildTrips(L,DEPS,1,now),b=buildTrips(L,DEPS,-1,now);
    TRIPS[L.id]=[...f.trips,...b.trips];
    INFO[L.id]={f,b};
  });
}
async function refresh(){
  const now=Date.now();
  $('#status').textContent='Mise à jour…';
  if(simMode){DEPS=simDeps(now);lastErrors=[];lastOk=now}
  else{
    const D={};const errs=[];
    await pool(Object.values(STOPS),6,async st=>{
      try{D[st.k]=await fetchStop(st,now)}catch(e){errs.push(st.n+' : '+e.message);st.bad=true}
    });
    lastErrors=errs;
    if(Object.keys(D).length){DEPS=D;lastOk=now}
  }
  recompute(Date.now());
  showStatus();renderBanner();renderDiag();renderStationsBad();renderPanel();
}
function showStatus(){
  if(!lastOk){$('#status').textContent='Aucune donnée reçue.';return}
  const s=Math.round((Date.now()-lastOk)/1000);
  $('#status').textContent=(simMode?'Simulation · ':'')+'Données mises à jour il y a '+s+' s · prochaine mise à jour automatique toutes les '+REFRESH_MS/1000+' s';
}
function renderBanner(){
  let h='';
  if(simMode)h+='<div class="banner sim">Mode simulation : horaires inventés, pour tester l\'affichage.</div>';
  else if(lastErrors.length)h+=`<div class="banner">${lastErrors.length} station(s) sans horaires. Ouvre le diagnostic en bas de page.</div>`;
  $('#banner').innerHTML=h;
}
function renderDiag(){
  const out=[];
  out.push('Heure : '+hms(Date.now()));if(typeof coordInfo!=='undefined'&&coordInfo)out.push(coordInfo);
  LINES.forEach(L=>{
    const I=INFO[L.id];if(!I)return;
    out.push(`Ligne ${L.id} : ${TRIPS[L.id].length} rames, ${I.f.unmatched+I.b.unmatched} passages non reliés`);
    [[I.f,1],[I.b,-1]].forEach(([x,dir])=>{
      x.order.forEach((i,k)=>{if(k>0&&!x.med[k])out.push(`  Segment sans mesure (sens ${dir>0?'aller':'retour'}) : ${L.names[x.order[k-1]]} → ${L.names[i]} (ordre ou nom à vérifier)`)});
    });
  });
  if(lastErrors.length){out.push('');out.push('Erreurs :');lastErrors.forEach(e=>out.push('  '+e))}
  $('#diag').textContent=out.join('\n');
}

/* ---------- Panneau ---------- */
function fit(){if(typeof map!=='undefined'&&map)setTimeout(()=>map.invalidateSize(),0)}
function minutes(t){const m=Math.round((t-Date.now())/60000);return m<=0?'maintenant':'dans '+m+' min'}
function renderPanel(){
  const el=$('#panel');
  if(!sel){el.hidden=true;fit();return}
  el.hidden=false;fit();
  const close='<button type="button" id="pclose">Fermer</button>';
  if(sel.type==='st'){
    const st=STOPS[sel.k];const now=Date.now();
    let cols='';
    st.lines.forEach(id=>{
      const L=LINES.find(l=>l.id===id);const n=L.names.length;
      [[L.names[n-1],L.end],[L.names[0],L.start]].forEach(([dest,key])=>{
        if(norm(st.n)===norm(dest))return;
        const rows=(DEPS[st.k]||[]).filter(d=>d.line===id&&norm(d.dest).includes(key)&&d.t>=now-30000).sort((a,b)=>a.t-b.t).slice(0,8);
        cols+=`<div><h4>Ligne ${id} vers ${esc(dest)}</h4>${rows.map(d=>`<div class="row"><span class="t">${hm(d.t)}</span>${d.rt?'<span class="dotlive" title="Temps réel"></span>':''}<span class="w">${minutes(d.t)}</span></div>`).join('')||'<div class="note">Aucun passage</div>'}</div>`;
      });
    });
    el.innerHTML=`<div class="in"><h3>${esc(st.n)}${close}</h3><div class="cols">${cols}</div><p class="note">Le point vert signale un horaire en temps réel.</p></div>`;
  }else{
    const L=LINES.find(l=>l.id===sel.line);
    const tr=(TRIPS[L.id]||[]).find(t=>t.dir===sel.dir&&lastOf(t).i===sel.lastI&&Math.abs(lastOf(t).t-sel.lastT)<150000);
    if(!tr){el.innerHTML=`<div class="in"><h3>Rame ${L.id}${close}</h3><p class="note">Cette rame n'est plus suivie.</p></div>`;}
    else{
      const now=Date.now();
      const sa=stateAt(tr,now);
      const stateTxt=!sa?'Terminus atteint.':(sa.state==='quai'?'À quai à '+L.names[sa.i]:'En transit entre '+L.names[sa.i0]+' et '+L.names[sa.i1]);
      const rows=tr.stops.filter(s=>!s.est&&s.t>=now-30000).map(s=>`<div class="row"><span class="t">${hm(s.t)}</span>${s.rt?'<span class="dotlive"></span>':''}<span>${esc(L.names[s.i])}</span><span class="w">${sa&&sa.state==='quai'&&sa.i===s.i?'à quai':(s.t<now?'parti':minutes(s.t))}</span></div>`).join('');
      el.innerHTML=`<div class="in"><h3>Rame ${L.id} vers ${esc(L.names[tr.dir>0?L.names.length-1:0])}${close}</h3><p class="state">${esc(stateTxt)}</p><div>${rows||'<p class="note">Terminus atteint.</p>'}</div></div>`;
    }
  }
  $('#pclose').onclick=()=>{sel=null;el.hidden=true;fit();renderStationsBad();tick()};
}


/* ---------- Coordonnées des stations ---------- */
// Position approximative de secours (latitude, longitude), dans l'ordre des stations.
const FALLBACK={
 A:[[43.5698,1.3911],[43.5731,1.3956],[43.5786,1.3996],[43.5832,1.4051],[43.5863,1.4101],[43.5890,1.4147],[43.5918,1.4197],[43.5960,1.4237],[43.5987,1.4285],[43.6002,1.4343],[43.6008,1.4448],[43.6044,1.4437],[43.6063,1.4490],[43.6110,1.4540],[43.6150,1.4640],[43.6190,1.4735],[43.6245,1.4785],[43.6385,1.4960]],
 B:[[43.6560,1.4430],[43.6470,1.4350],[43.6390,1.4290],[43.6310,1.4330],[43.6250,1.4390],[43.6200,1.4410],[43.6150,1.4440],[43.6102,1.4492],[43.6063,1.4490],[43.6025,1.4465],[43.6000,1.4440],[43.5980,1.4440],[43.5930,1.4440],[43.5870,1.4430],[43.5810,1.4490],[43.5760,1.4550],[43.5700,1.4630],[43.5640,1.4700],[43.5570,1.4760]]
};
const COORD={},SRC={};
LINES.forEach(L=>L.names.forEach((n,i)=>{const k=norm(n);if(!COORD[k]){COORD[k]=FALLBACK[L.id][i];SRC[k]='approx'}}));

async function loadCoords(){
  let data=null;
  try{const c=JSON.parse(localStorage.getItem('tm-coords')||'null');if(c&&Date.now()-c.t<30*864e5)data=c.d}catch(e){}
  if(!data){
    const q='[out:json][timeout:25];(nwr["railway"="station"]["station"="subway"](43.50,1.30,43.72,1.60);nwr["railway"="station"]["subway"="yes"](43.50,1.30,43.72,1.60););out center;';
    for(const base of ['https://overpass-api.de/api/interpreter','https://overpass.kumi.systems/api/interpreter']){
      try{
        const r=await fetch(base+'?data='+encodeURIComponent(q));
        if(!r.ok)continue;
        const j=await r.json();
        data=(j.elements||[]).map(e=>({n:(e.tags&&e.tags.name)||'',lat:e.lat||(e.center&&e.center.lat),lon:e.lon||(e.center&&e.center.lon)})).filter(e=>e.n&&e.lat&&e.lon);
        if(data.length){try{localStorage.setItem('tm-coords',JSON.stringify({t:Date.now(),d:data}))}catch(e){}break}
      }catch(e){}
    }
  }
  let found=0;
  if(data&&data.length){
    Object.keys(STOPS).forEach(k=>{
      const m=data.find(e=>norm(e.n)===k)||data.find(e=>{const o=norm(e.n);return o.includes(k)||k.includes(o)});
      if(m){COORD[k]=[m.lat,m.lon];SRC[k]='osm';found++}
    });
  }
  return found;
}

/* ---------- Carte ---------- */
const LCOL={A:'#d7263d',B:'#f2b705'};
let map,netLayer,trainLayer,stLayer;
const visible={A:true,B:true};
function initMap(){
  map=L.map('map',{zoomControl:true,attributionControl:true}).setView([43.6045,1.4440],12);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{
    maxZoom:19,
    attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
  }).addTo(map);
  netLayer=L.layerGroup().addTo(map);stLayer=L.layerGroup().addTo(map);trainLayer=L.layerGroup().addTo(map);
  const lab=()=>$('#map').classList.toggle('nolabels',map.getZoom()<14);
  map.on('zoomend',lab);lab();
}
function drawNetwork(){
  netLayer.clearLayers();stLayer.clearLayers();
  LINES.forEach(L=>{
    if(!visible[L.id])return;
    const pts=L.names.map(n=>COORD[norm(n)]);
    netLayer.addLayer(window.L.polyline(pts,{color:LCOL[L.id],weight:6,opacity:.9}));
  });
  const done={};
  LINES.forEach(L=>{
    if(!visible[L.id])return;
    L.names.forEach(n=>{
      const k=norm(n);if(done[k])return;done[k]=1;
      const st=STOPS[k];
      const m=window.L.circleMarker(COORD[k],{radius:6,weight:3,color:'#1d1a22',fillColor:'#ffffff',fillOpacity:1});
      m.bindTooltip(n+(SRC[k]==='approx'?' (position approximative)':''),{permanent:true,direction:'right',offset:[8,0],className:'stlabel'});
      m.on('click',()=>{sel={type:'st',k};renderPanel();tick()});
      stLayer.addLayer(m);
    });
  });
}
function bearing(a,b){
  const dy=b[0]-a[0],dx=(b[1]-a[1])*Math.cos(a[0]*Math.PI/180);
  return (Math.atan2(dx,dy)*180/Math.PI+360)%360;
}
function lastOf(tr){return tr.stops[tr.stops.length-1]}
function renderStationsBad(){}
const sigAll={v:''};
function tick(){
  const now=Date.now();
  $('#clock').textContent=hms(now);
  if(lastOk)showStatus();
  const items=[];const counts={A:[0,0],B:[0,0]};
  LINES.forEach(L=>{
    (TRIPS[L.id]||[]).forEach((tr,idx)=>{
      const st=stateAt(tr,now);if(!st)return;
      const last=lastOf(tr);
      const on=!!(sel&&sel.type==='tr'&&sel.line===L.id&&sel.dir===tr.dir&&sel.lastI===last.i&&Math.abs(sel.lastT-last.t)<150000);
      if(on)sel.lastT=last.t;
      let pos,b,label;const n=L.names.length;
      const P=i=>COORD[norm(L.names[i])];
      if(st.state==='quai'){
        counts[L.id][0]++;pos=P(st.i);
        const nx=st.i+tr.dir;b=(nx>=0&&nx<n)?bearing(pos,P(nx)):bearing(P(st.i-tr.dir),pos);
        label='à quai à '+L.names[st.i];
      }else{
        counts[L.id][1]++;const a=P(st.i0),c=P(st.i1);
        pos=[(a[0]+c[0])/2,(a[1]+c[1])/2];b=bearing(a,c);
        label='en transit entre '+L.names[st.i0]+' et '+L.names[st.i1];
      }
      items.push({L,tr,idx,st,pos,b,on,label,rt:tr.stops.some(s=>s.rt&&!s.est)});
    });
  });
  LINES.forEach(L=>{$('#cnt-'+L.id).textContent=counts[L.id][0]+' à quai · '+counts[L.id][1]+' en transit'});
  const shown=items.filter(x=>visible[x.L.id]);
  const sig=shown.map(x=>[x.L.id,x.tr.dir,x.st.state,x.pos[0].toFixed(5),x.pos[1].toFixed(5),x.on,x.rt].join(',')).join('|');
  if(sig===sigAll.v)return;
  sigAll.v=sig;
  trainLayer.clearLayers();
  shown.forEach(x=>{
    const rad=(x.b+90)*Math.PI/180;
    const dx=Math.sin(rad)*9,dy=-Math.cos(rad)*9; // décalage latéral : les deux sens ne se superposent pas
    const html=`<div class="mk ${x.L.id}${x.st.state==='transit'?' transit':''}${x.on?' sel':''}${x.rt?' rt':''}" style="transform:translate(${dx.toFixed(1)}px,${dy.toFixed(1)}px)" title="${esc(x.label)}"><span class="ar" style="transform:rotate(${(x.b-90).toFixed(0)}deg)">➤</span></div>`;
    const m=window.L.marker(x.pos,{icon:window.L.divIcon({className:'',html,iconSize:[26,26],iconAnchor:[13,13]}),keyboard:true,title:x.label,alt:'Rame '+x.L.id+' '+x.label});
    m.on('click',()=>{const l=lastOf(x.tr);sel={type:'tr',line:x.L.id,dir:x.tr.dir,lastI:l.i,lastT:l.t};renderPanel();tick()});
    trainLayer.addLayer(m);
  });
}

/* ---------- Événements ---------- */
['A','B'].forEach(id=>{
  $('#tg-'+id).onclick=()=>{
    visible[id]=!visible[id];$('#tg-'+id).setAttribute('aria-pressed',visible[id]);
    drawNetwork();sigAll.v='';tick();
  };
});
$('#refresh').onclick=refresh;
$('#sim').onclick=()=>{simMode=!simMode;$('#sim').setAttribute('aria-pressed',simMode);DEPS={};lastOk=0;refresh()};
(async function start(){
  initMap();
  drawNetwork();
  tick();
  setInterval(tick,1000);
  setInterval(refresh,REFRESH_MS);
  setInterval(()=>{if(sel)renderPanel()},10000);
  refresh();
  const found=await loadCoords();
  coordInfo=found?`Positions des stations : ${found} lues depuis OpenStreetMap, ${Object.keys(STOPS).length-found} approximatives.`:'Positions des stations : toutes approximatives (OpenStreetMap injoignable).';
  drawNetwork();
  const pts=Object.values(COORD);if(pts.length)map.fitBounds(pts,{padding:[30,30]});
  sigAll.v='';tick();renderDiag();
})();
let coordInfo='';

</script>
